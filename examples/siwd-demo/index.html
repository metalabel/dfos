<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>"
    />
    <title>Sign In With DFOS — demo</title>
    <style>
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Helvetica,
          sans-serif;
        line-height: 1.5;
        margin: 0 auto;
        max-width: 28rem;
        padding: 3rem 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      /* The one-line intro under the signed-out h1. */
      .lede {
        color: #444;
        margin-bottom: 1.5rem;
      }
      h2 {
        font-size: 1.125rem;
        margin: 0.5rem 0;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 0.75rem;
        margin: 0 0 1.25rem;
        padding: 1.25rem;
      }
      .card > h2:first-child {
        margin-top: 0;
      }
      button {
        background: #111;
        border: 0;
        border-radius: 0.5rem;
        color: #fff;
        cursor: pointer;
        font: inherit;
        padding: 0.6rem 1rem;
      }
      /* Secondary actions — sign out, re-read — next to a primary that is the
         page's own subject rather than a button. */
      button.quiet {
        background: #fff;
        border: 1px solid #ccc;
        color: #111;
        font-size: 0.875rem;
        padding: 0.4rem 0.8rem;
      }
      /* ---------------------------------------------------------------------
         Four tiers, in the order the page reads: the hero carries the payoff,
         the session strip is a status line, this app's identity is quieter
         still, and the receipts are closed. Weight, not just order, is what
         makes that a hierarchy rather than a stack of equal boxes.
         ------------------------------------------------------------------ */

      /* Tier 1 — the hero. */
      .hero {
        border-color: #ccc;
        padding: 1.5rem;
      }
      .hero h2 {
        font-size: 1.5rem;
        line-height: 1.2;
        margin: 0;
      }
      .hero .handle {
        color: #666;
        margin: 0.15rem 0 0;
      }
      .hero .bio {
        margin: 0.75rem 0 0;
      }
      .hero .meta {
        margin-top: 1rem;
      }
      .hero .meta p {
        margin: 0.15rem 0;
      }
      .hero button {
        margin-top: 1rem;
      }
      .hero details.rawjson {
        margin-top: 1rem;
      }

      /* Tier 1, second read — the spaces. Same payoff tier as the hero and one
         weight down from it: a list to run down, not a headline. */
      .memberships h2 {
        font-size: 1.125rem;
      }
      .memberships p {
        margin: 0.1rem 0;
      }
      .memberships ul.spaces {
        list-style: none;
        margin: 0.75rem 0 0;
        padding: 0;
      }
      .memberships ul.spaces > li {
        border-top: 1px solid #eee;
        padding: 0.6rem 0;
      }
      .memberships ul.spaces > li:first-child {
        border-top: 0;
      }
      .memberships .name {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }
      .memberships .avatar {
        border-radius: 50%;
        height: 1.5rem;
        object-fit: cover;
        width: 1.5rem;
      }
      /* A group's color is a named palette token, rendered as a dot. An
         unrecognized token gets no dot at all rather than a guessed color. */
      .memberships .dot {
        border-radius: 999px;
        height: 0.5rem;
        width: 0.5rem;
      }
      .memberships ul.groups {
        list-style: none;
        margin: 0.4rem 0 0;
        padding-left: 1rem;
      }
      .memberships ul.groups li {
        margin: 0.3rem 0;
      }
      .memberships details.rawjson,
      .memberships button {
        margin-top: 1rem;
      }

      /* Tier 2 — the session strip. Compact, and visibly a status line. */
      .session {
        background: #fafafa;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.75rem;
        padding: 0.85rem 1rem;
      }
      .session .who {
        flex: 1 1 100%;
        font-size: 0.875rem;
        margin: 0;
      }
      .session button {
        margin-left: auto;
      }

      /* Tier 3 — this app's own identity. Present, deliberately unshouty. */
      .quiet {
        background: #fcfcfc;
        border-color: #eee;
        padding: 1rem 1.25rem;
      }
      .quiet h2 {
        color: #555;
        font-size: 0.9375rem;
        letter-spacing: 0.02em;
        margin: 0 0 0.6rem;
        text-transform: uppercase;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0;
      }
      .chip {
        background: #eee;
        border-radius: 999px;
        color: #444;
        font-size: 0.75rem;
        padding: 0.15rem 0.6rem;
        white-space: nowrap;
      }
      .chip.ok {
        background: #e6f4ea;
        color: #14532d;
      }
      .chip.warn {
        background: #fdeaea;
        color: #7f1d1d;
      }

      /* Link lists: every "go check this yourself" on the page is one of these,
         so they scan as a list rather than hiding inside a paragraph. */
      ul.linklist {
        font-size: 0.875rem;
        list-style: none;
        margin: 0.75rem 0 0;
        padding: 0;
      }
      ul.linklist li {
        border-top: 1px solid #eee;
        padding: 0.4rem 0;
      }
      ul.linklist li:first-child {
        border-top: 0;
      }

      /* Fact lists: label/value pairs where the page used to run a paragraph of
         annotation under every field. */
      dl.facts {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 0.75rem;
        font-size: 0.875rem;
        margin: 0.5rem 0 0;
      }
      dl.facts dt {
        color: #666;
      }
      dl.facts dd {
        margin: 0;
        min-width: 0;
      }
      /* A quieter block under the main content of a card — separated, not boxed,
         so the page stays one column of 28rem rather than a stack of frames. */
      .section {
        border-top: 1px solid #eee;
        margin: 1.25rem 0 0;
        padding-top: 1rem;
      }
      .section p {
        margin: 0.5rem 0 0;
      }
      .section p:first-child {
        margin-top: 0;
      }
      code {
        font-size: 0.8125rem;
        word-break: break-all;
      }
      /* The scope toggle: one row per scope, the radio held at the top of its
         label so a wrapped multi-line description stays aligned to it. */
      .scopes {
        margin: 0 0 1.25rem;
      }
      label.scope {
        align-items: start;
        cursor: pointer;
        display: flex;
        font-size: 0.875rem;
        gap: 0.6rem;
        margin: 0.75rem 0;
      }
      label.scope input {
        margin: 0.25rem 0 0;
      }
      label.scope.disabled {
        cursor: default;
        opacity: 0.7;
      }
      .dim {
        color: #666;
        font-size: 0.875rem;
      }
      .notice {
        color: #a11;
        font-size: 0.875rem;
      }
      ol.steps,
      ul.checks {
        color: #666;
        font-size: 0.875rem;
        margin: 1rem 0 0;
        padding-left: 1.25rem;
      }
      ol.steps li,
      ul.checks li {
        margin: 0.35rem 0;
      }
      details {
        margin-top: 1.5rem;
      }
      details summary {
        cursor: pointer;
        font-size: 0.875rem;
      }
      details h3 {
        font-size: 0.9375rem;
        margin: 1.5rem 0 0.5rem;
      }
      details p {
        margin: 0.5rem 0;
      }
      /* The JWS and the decoded JSON are long single-line strings; let them wrap
         rather than introducing a horizontal scrollbar on a 28rem page. */
      pre.wrap {
        background: #f6f6f6;
        border-radius: 0.5rem;
        font-size: 0.75rem;
        margin: 0.5rem 0;
        overflow-x: auto;
        padding: 0.75rem;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <footer class="dim">
      <p>
        <a href="https://protocol.dfos.com/siwd">SIWD spec</a> ·
        <a href="https://protocol.dfos.com/api-auth">API-AUTH spec</a> ·
        <a href="https://github.com/metalabel/dfos">source on GitHub</a>
      </p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
