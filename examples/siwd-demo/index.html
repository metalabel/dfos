<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>"
    />
    <title>Sign In With DFOS — demo</title>
    <style>
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Helvetica,
          sans-serif;
        line-height: 1.5;
        margin: 0 auto;
        max-width: 28rem;
        padding: 3rem 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      h2 {
        font-size: 1.125rem;
        margin: 0.5rem 0;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 0.75rem;
        padding: 1.25rem;
      }
      button {
        background: #111;
        border: 0;
        border-radius: 0.5rem;
        color: #fff;
        cursor: pointer;
        font: inherit;
        padding: 0.6rem 1rem;
      }
      code {
        font-size: 0.8125rem;
        word-break: break-all;
      }
      .dim {
        color: #666;
        font-size: 0.875rem;
      }
      .notice {
        color: #a11;
        font-size: 0.875rem;
      }
      img.avatar {
        border-radius: 50%;
        height: 64px;
        width: 64px;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <footer class="dim">
      <p>
        <a href="https://protocol.dfos.com/siwd">SIWD spec</a> ·
        <a href="https://github.com/metalabel/dfos">source on GitHub</a>
      </p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
