<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>"
    />
    <title>Sign In With DFOS — demo</title>
    <style>
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Helvetica,
          sans-serif;
        line-height: 1.5;
        margin: 0 auto;
        max-width: 28rem;
        padding: 3rem 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      h2 {
        font-size: 1.125rem;
        margin: 0.5rem 0;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 0.75rem;
        margin: 0 0 1.25rem;
        padding: 1.25rem;
      }
      .card > h2:first-child {
        margin-top: 0;
      }
      button {
        background: #111;
        border: 0;
        border-radius: 0.5rem;
        color: #fff;
        cursor: pointer;
        font: inherit;
        padding: 0.6rem 1rem;
      }
      /* Secondary actions — sign out, re-read — next to a primary that is the
         page's own subject rather than a button. */
      button.quiet {
        background: #fff;
        border: 1px solid #ccc;
        color: #111;
        font-size: 0.875rem;
        padding: 0.4rem 0.8rem;
      }
      /* The session indicator: the strip an application puts at the top to say
         who is signed in and what they are signed in with. */
      .session {
        background: #fafafa;
      }
      .session .who {
        margin: 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0.6rem 0;
      }
      .chip {
        background: #eee;
        border-radius: 999px;
        color: #444;
        font-size: 0.75rem;
        padding: 0.15rem 0.6rem;
      }
      .chip.ok {
        background: #e6f4ea;
        color: #14532d;
      }
      .chip.warn {
        background: #fdeaea;
        color: #7f1d1d;
      }
      /* The profile hero's secondary facts, held together under the bio. */
      .handle {
        color: #666;
        margin: 0 0 0.75rem;
      }
      .meta p {
        margin: 0.15rem 0;
      }
      .links {
        font-size: 0.875rem;
      }
      /* A quieter block under the main content of a card — separated, not boxed,
         so the page stays one column of 28rem rather than a stack of frames. */
      .section {
        border-top: 1px solid #eee;
        margin: 1.25rem 0 0;
        padding-top: 1rem;
      }
      .section p {
        margin: 0.5rem 0 0;
      }
      .section p:first-child {
        margin-top: 0;
      }
      code {
        font-size: 0.8125rem;
        word-break: break-all;
      }
      /* The scope toggle: one row per scope, the radio held at the top of its
         label so a wrapped multi-line description stays aligned to it. */
      .scopes {
        margin: 0 0 1.25rem;
      }
      label.scope {
        align-items: start;
        cursor: pointer;
        display: flex;
        font-size: 0.875rem;
        gap: 0.6rem;
        margin: 0.75rem 0;
      }
      label.scope input {
        margin: 0.25rem 0 0;
      }
      label.scope.disabled {
        cursor: default;
        opacity: 0.7;
      }
      .dim {
        color: #666;
        font-size: 0.875rem;
      }
      .notice {
        color: #a11;
        font-size: 0.875rem;
      }
      ol.steps,
      ul.checks {
        color: #666;
        font-size: 0.875rem;
        margin: 1rem 0 0;
        padding-left: 1.25rem;
      }
      ol.steps li,
      ul.checks li {
        margin: 0.35rem 0;
      }
      details {
        margin-top: 1.5rem;
      }
      details summary {
        cursor: pointer;
        font-size: 0.875rem;
      }
      details h3 {
        font-size: 0.9375rem;
        margin: 1.5rem 0 0.5rem;
      }
      details p {
        margin: 0.5rem 0;
      }
      /* The JWS and the decoded JSON are long single-line strings; let them wrap
         rather than introducing a horizontal scrollbar on a 28rem page. */
      pre.wrap {
        background: #f6f6f6;
        border-radius: 0.5rem;
        font-size: 0.75rem;
        margin: 0.5rem 0;
        overflow-x: auto;
        padding: 0.75rem;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <footer class="dim">
      <p>
        <a href="https://protocol.dfos.com/siwd">SIWD spec</a> ·
        <a href="https://protocol.dfos.com/api-auth">API-AUTH spec</a> ·
        <a href="https://github.com/metalabel/dfos">source on GitHub</a>
      </p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
