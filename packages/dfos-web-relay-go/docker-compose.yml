# 3-node ring topology for testing peering behaviors.
#
# Build:  docker compose build
# Start:  docker compose up
# Test:   ./topology.sh smoke
# Clean:  docker compose down -v
#
# AUTHORITY is the host each node's identity proofs are checked against, and it
# is the PUBLISHED host[:port] a client reaches — not the container's internal
# one. These nodes are driven from the host through their mapped ports, so each
# gets its own localhost:<mapped port>. Without it every authenticated write
# (blob upload, non-public blob download, mailbox poll) answers 503 on a fresh
# clone, which makes this fixture unable to exercise the write paths it exists
# to test.

services:
  relay-a:
    build:
      context: ../..
      dockerfile: packages/dfos-web-relay-go/Dockerfile
    environment:
      PORT: '8080'
      RELAY_NAME: 'relay-a'
      AUTHORITY: 'localhost:9801'
      PEERS: 'http://relay-b:8080'
      SYNC_INTERVAL: '5s'
    ports:
      - '9801:8080'
    volumes:
      - data-a:/data

  relay-b:
    build:
      context: ../..
      dockerfile: packages/dfos-web-relay-go/Dockerfile
    environment:
      PORT: '8080'
      RELAY_NAME: 'relay-b'
      AUTHORITY: 'localhost:9802'
      PEERS: 'http://relay-c:8080'
      SYNC_INTERVAL: '5s'
    ports:
      - '9802:8080'
    volumes:
      - data-b:/data

  relay-c:
    build:
      context: ../..
      dockerfile: packages/dfos-web-relay-go/Dockerfile
    environment:
      PORT: '8080'
      RELAY_NAME: 'relay-c'
      AUTHORITY: 'localhost:9803'
      PEERS: 'http://relay-a:8080'
      SYNC_INTERVAL: '5s'
    ports:
      - '9803:8080'
    volumes:
      - data-c:/data

volumes:
  data-a:
  data-b:
  data-c:
