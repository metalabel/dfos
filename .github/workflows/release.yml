name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version lockstep
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            echo "Run: ./scripts/release.sh $TAG_VERSION"
            exit 1
          fi

  # Re-run the FULL correctness matrix against the tagged commit. CI only runs on
  # branch pushes and PRs, not on tag pushes, so we cannot rely on a prior CI run
  # having gated this exact commit. This calls the same reusable workflow as CI,
  # so the release gate can never drift into a subset of the matrix. Gate every
  # publish/deploy job on this.
  test:
    uses: ./.github/workflows/test-matrix.yml

  release-npm:
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # required for npm provenance (--provenance signs via the GitHub OIDC token)
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Auth is npm trusted publishing (OIDC): each package on npmjs.com is
      # configured to trust this repo + this workflow file, and pnpm exchanges
      # the job's OIDC token for publish access. No npm token exists anywhere.
      # Renaming this file breaks the trust binding — update the trusted
      # publisher config on npmjs.com for every package if it ever moves.
      - name: Publish packages (skipping already-published versions)
        run: |
          for dir in dfos-protocol dfos-web-relay dfos-client; do
            pkg=$(node -p "require('./packages/$dir/package.json').name")
            ver=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "$pkg@$ver already on npm — skipping"
            else
              pnpm --filter "$pkg" publish --no-git-checks --access public --provenance
            fi
          done

  release-goreleaser:
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/dfos-cli/go.mod
          cache-dependency-path: packages/dfos-cli/go.sum

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  deploy-site:
    needs: [release-goreleaser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter @metalabel/site-protocol build

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter @metalabel/site-protocol run deploy -- --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
