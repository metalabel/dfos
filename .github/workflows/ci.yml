name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full correctness matrix lives in test-matrix.yml (a reusable workflow)
  # so CI and Release gate on the exact same set of jobs. Deploy gates on this
  # workflow's conclusion via workflow_run.
  test-matrix:
    uses: ./.github/workflows/test-matrix.yml

  # The examples are outside the pnpm workspace on purpose — each one is a
  # standalone npm project consuming the PUBLISHED packages from the registry,
  # so this job is also a live check that the released artifacts install and
  # build for a third party.
  siwd-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/siwd-demo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
