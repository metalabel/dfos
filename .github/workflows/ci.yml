name: CI

on:
  push:
    branches: [main]
  pull_request:

# Key pull_request runs by PR number, not by ref: a pull_request run that starts
# after its PR merges resolves `github.ref` to `refs/heads/main` (observable in
# its reusable-workflow resolution), landing it in the push run's group — where
# cancel-in-progress kills the real main CI for the merge commit. Seen on #294
# and #296 (runs 33021768492, 33022478169), both cancelled ~20s after a ghost
# post-merge pull_request run spawned.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The full correctness matrix lives in test-matrix.yml (a reusable workflow)
  # so CI and Release gate on the exact same set of jobs. Deploy gates on this
  # workflow's conclusion via workflow_run.
  test-matrix:
    uses: ./.github/workflows/test-matrix.yml

  # The examples are outside the pnpm workspace on purpose — each one is a
  # standalone npm project consuming the PUBLISHED packages from the registry
  # (at the versions pinned by its own lockfile), so this job also proves that
  # released artifacts a third party would install actually build.
  siwd-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/siwd-demo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
